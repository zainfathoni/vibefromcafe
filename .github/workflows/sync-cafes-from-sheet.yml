name: Sync Cafes From Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-cafes:
    runs-on: ubuntu-latest
    env:
      # Prefer PAT_TOKEN so the generated PR triggers CI, but keep a safe
      # fallback to github.token so scheduled syncs still open a PR.
      CREATE_PR_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync cafes.json from Google Sheets
        run: npm run sync:cafes

      - name: Warn when PAT_TOKEN is not configured
        if: ${{ secrets.PAT_TOKEN == '' }}
        run: |
          echo "::warning title=PAT_TOKEN not configured::Falling back to github.token. The sync PR will still be created, but downstream push and pull_request workflows will not run on that PR. Add a fine-grained PAT as the PAT_TOKEN repository secret with contents: write and pull-requests: write permissions to re-enable CI on sync PRs."

      - name: Create pull request for data changes
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ env.CREATE_PR_TOKEN }}
          branch: chore/auto-sync-cafes-json
          delete-branch: true
          commit-message: "chore(data): sync cafes.json from Google Sheets"
          title: "chore(data): sync cafes.json from Google Sheets"
          body: |
            ## Summary
            - fetch latest cafe directory rows from the Google Sheets CSV export
            - transform rows into `app/data/types.ts` `Cafe` shape
            - update `app/data/cafes.json` when differences are detected

            This PR was created automatically by `.github/workflows/sync-cafes-from-sheet.yml`.
